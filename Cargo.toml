[package]
name = "inb"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "A screen recorder for macOS and Windows that saves GIFs"
repository = "https://github.com/sandrogekeler/Inb"
publish = false

[dependencies]
ab_glyph = "0.2"
gif = "0.14"
tiny-skia = "0.11"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
winit = "0.30"

[target.'cfg(windows)'.dependencies]
windows-capture = "2"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
objc2-screen-capture-kit = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
