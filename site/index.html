<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inb</title>
<meta name="description" content="Record part of your screen as a GIF. For Windows and macOS.">
<link rel="preload" href="fonts/familjen-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/hanken-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Familjen Grotesk"; src: url("fonts/familjen-grotesk.woff2") format("woff2"); font-weight: 500 700; font-display: swap; }
@font-face { font-family: "Hanken Grotesk"; src: url("fonts/hanken-grotesk.woff2") format("woff2"); font-weight: 400 600; font-display: swap; }
/* Layout: one section, text and downloads on the left, the app recording on the right; stacks on phones.
   Fonts: Familjen Grotesk for the wordmark, Hanken Grotesk for text, both OFL and not on the AI-default list. */
:root {
  --ground: #ececee;
  --ink: #1c1c1e;
  --muted: #5d5d63;
  --line: #d2d2d6;
  --button: #1c1c1e;
  --button-ink: #f5f5f7;
  --desk: #d7d8dc;
  --window: #fbfbfc;
  --window-bar: #eeeef0;
  --window-line: #c9c9ce;
  --shape: #8e8e96;
  --display: "Familjen Grotesk", "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --text: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;

  /* Inb's own colours, from src/spec.rs. The same in both themes. */
  --inb-bg: #1c1c1e;
  --inb-fg: #f5f5f7;
  --inb-muted: #a1a1a6;
  --inb-chip: rgba(255, 255, 255, 0.1);
  --inb-edge: rgba(0, 0, 0, 0.55);
  --inb-dot: #ff453a;
  --inb-rec: #e5342b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141416; --ink: #f2f2f4; --muted: #a3a3aa; --line: #2c2c30;
    --button: #f2f2f4; --button-ink: #141416;
    --desk: #303035; --window: #46464c; --window-bar: #3c3c42; --window-line: #56565d; --shape: #8a8a92;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #141416; --ink: #f2f2f4; --muted: #a3a3aa; --line: #2c2c30;
  --button: #f2f2f4; --button-ink: #141416;
  --desk: #303035; --window: #46464c; --window-bar: #3c3c42; --window-line: #56565d; --shape: #8a8a92;
  color-scheme: dark;
}

html, body { height: 100%; margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 400 17px/1.5 var(--text);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 3px; }

.page {
  min-height: 100%;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
  align-items: center;
  gap: clamp(32px, 6vw, 96px);
  max-width: 1240px;
  margin: 0 auto;
  padding-block: 48px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}

.info { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
.wordmark {
  margin: 0;
  font: 600 clamp(72px, 9vw, 120px)/0.9 var(--display);
  letter-spacing: -0.04em;
}
.lede {
  margin: -12px 0 0;
  font-size: clamp(20px, 2vw, 24px);
  line-height: 1.3;
  text-wrap: balance;
}

.downloads { display: grid; grid-template-columns: repeat(2, minmax(0, max-content)); gap: 12px; }
.dl-item { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.dl {
  display: flex; align-items: center; justify-content: center;
  padding: 13px 20px;
  border-radius: 3px;
  background: var(--button);
  color: var(--button-ink);
  font: 600 16px/1.15 var(--text);
  text-align: center;
  text-decoration: none;
}
.dl.secondary { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.req { color: var(--muted); font-size: 14px; }

.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.steps li { display: flex; gap: 12px; align-items: baseline; }
.steps li::before {
  content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted); transform: translateY(-3px);
}

/* The demo: a desktop at Inb's own point sizes, scaled to fit. */
.demo { min-width: 0; }
.stage-box { position: relative; width: 100%; aspect-ratio: 640 / 440; max-width: 100%; }
.stage {
  position: absolute; left: 0; top: 0;
  width: 640px; height: 440px;
  transform-origin: 0 0;
  background: var(--desk);
  border-radius: 6px;
  overflow: hidden;
  font: 500 13px/1 var(--text);
  user-select: none;
}

.win {
  position: absolute; left: 44px; top: 40px; width: 552px; height: 330px;
  background: var(--window); border-radius: 6px;
  box-shadow: 0 0 0 1px var(--window-line), 0 12px 30px rgba(0, 0, 0, 0.12);
  overflow: hidden;
}
.win-bar { height: 30px; background: var(--window-bar); border-bottom: 1px solid var(--window-line); display: flex; align-items: center; gap: 7px; padding: 0 12px; }
.win-bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--window-line); }
.win-bar span { margin-left: auto; margin-right: auto; transform: translateX(-24px); color: var(--muted); font-size: 12px; }
.screen { position: absolute; left: 0; top: 31px; width: 552px; height: 299px; display: block; }

.dim { position: absolute; box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.15); pointer-events: none; }
.band { position: absolute; border: 2px solid var(--inb-bg); border-radius: 3px; box-shadow: 0 0 0 1px var(--inb-edge); }
.handle { position: absolute; width: 6px; height: 6px; background: var(--inb-bg); box-shadow: 0 0 0 1px var(--inb-edge); }

.bar {
  position: absolute; width: 224px; height: 36px;
  background: var(--inb-bg); color: var(--inb-fg);
  border-radius: 3px; box-shadow: 0 0 0 1px var(--inb-edge);
  overflow: hidden;
}
.bar > * { position: absolute; top: 4px; height: 28px; display: flex; align-items: center; }
.bar .label { white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar .label em { font-style: normal; color: var(--inb-muted); margin-left: 6px; }
.bar .btn { justify-content: center; gap: 6px; border-radius: 3px; background: var(--inb-chip); }
.bar .plain { background: none; color: var(--inb-muted); }
.bar .pressed { background: rgba(255, 255, 255, 0.24); }
.bar svg { width: 12px; height: 12px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--inb-dot); }
.circle { top: 0; height: auto; border-radius: 50%; background: var(--inb-rec); }
.bar.live .btn { background: rgba(0, 0, 0, 0.22); }
.bar.live .btn.pressed { background: rgba(0, 0, 0, 0.36); }

.cursor { position: absolute; left: 0; top: 0; width: 20px; height: 20px; transform-origin: 2px 2px; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.3)); }

@media (max-width: 860px) {
  .page { grid-template-columns: minmax(0, 1fr); align-items: start; gap: 40px; padding-block: 40px; }
  .info { gap: 26px; }
}
@media (max-width: 460px) {
  .downloads { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .dl { flex: 1; padding: 12px 6px; font-size: 14px; }
  .req { font-size: 13px; }
}
</style>
</head>
<body>

<main class="page">
  <section class="info" aria-labelledby="name">
    <h1 class="wordmark" id="name">Inb</h1>
    <p class="lede">Record part of your screen as a GIF.</p>

    <div class="downloads">
      <div class="dl-item">
        <a class="dl" id="dl-win" href="https://github.com/sandrogekeler/Inb/releases">Download for Windows</a>
        <span class="req">Windows 10 (2004) or later</span>
      </div>
      <div class="dl-item">
        <a class="dl secondary" id="dl-mac" href="https://github.com/sandrogekeler/Inb/releases">Download for macOS</a>
        <span class="req">macOS 13 or later</span>
      </div>
    </div>

    <ul class="steps">
      <li>Drag the frame around what you want.</li>
      <li>Click record, then stop.</li>
      <li>Paste the GIF anywhere, or save it.</li>
    </ul>

  </section>

  <section class="demo" aria-label="Inb recording part of a window">
    <div class="stage-box" id="box">
      <div class="stage" id="stage" aria-hidden="true">
        <div class="win">
          <div class="win-bar"><i></i><i></i><i></i><span id="title"></span></div>
          <canvas class="screen" id="screen" width="1104" height="598"></canvas>
        </div>
        <div class="dim" id="dim"></div>
        <div class="band" id="band"></div>
        <div class="handle" id="h0"></div><div class="handle" id="h1"></div>
        <div class="handle" id="h2"></div><div class="handle" id="h3"></div>
        <div class="bar" id="bar"></div>
        <svg class="cursor" id="cursor" viewBox="0 0 20 20"><path d="M2 2v14.5l3.8-3.6 2.5 5.6 2.4-1-2.5-5.5H14z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  // Sizes and timings from Inb's src/spec.rs and src/bar.rs, in points.
  const BAND = 2, GAP = 6, BAR_W = 224, HANDLE = 6;
  const ARM = 1000, GROW = 600, FADE = 350, SHRINK = 450;
  const REC = [172, 18]; // centre of the record button on the bar
  const BG = [0x1c, 0x1c, 0x1e], RED = [0xe5, 0x34, 0x2b];

  const START = { x: 130, y: 90, w: 300, h: 180 };
  const END = { x: 130, y: 90, w: 400, h: 230 };

  // The loop, in ms.
  const T = {
    toCorner: [200, 900], drag: [1000, 2000], toRecord: [2300, 3000],
    click: 3100, recording: 3100 + ARM + GROW, toStop: [6700, 7300], stop: 7500,
    encoded: 8900, away: [9300, 10000], fadeOut: [11600, 12100], end: 12300,
  };

  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), box = $("box"), bar = $("bar"), cursor = $("cursor");
  const ease = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const span = (t, [a, b]) => Math.min(1, Math.max(0, (t - a) / (b - a)));
  const mix = (a, b, p) => a + (b - a) * p;
  const rgb = (p) => `rgb(${BG.map((c, i) => Math.round(mix(c, RED[i], p))).join(",")})`;

  const icons = {
    chevron: '<svg viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    cross: '<svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3 3 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    square: '<svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" fill="currentColor"/></svg>',
  };
  const at = (x, w) => `style="left:${x}px;width:${w}px"`;

  // One layout per bar state, the same widths and order as bar.rs.
  const layouts = {
    idle: (s) => `
      <div class="label" ${at(10, 68)} id="size">${s.size}</div>
      <div class="btn" ${at(84, 68)}>15 fps ${icons.chevron}</div>
      <div class="btn${s.press === "rec" ? " pressed" : ""}" ${at(158, 28)}><div class="dot" id="dot"></div></div>
      <div class="btn plain" ${at(192, 28)}>${icons.cross}</div>
      <div class="circle" id="circle"></div>`,
    live: (s) => `
      <div class="circle" id="circle"></div>
      <div class="label" ${at(10, 128)} id="time">0:00</div>
      <div class="btn${s.press === "stop" ? " pressed" : ""}" ${at(144, 76)}>${icons.square} Stop</div>`,
    encoding: () => `
      <div class="label" ${at(10, 176)}>Encoding<em id="pct">0%</em></div>
      <div class="btn plain" ${at(192, 28)}>${icons.cross}</div>
      <div class="circle" id="circle"></div>`,
    done: () => `
      <div class="label" ${at(10, 118)}>Copied<em>1.4 MB</em></div>
      <div class="btn" ${at(134, 52)}>Save</div>
      <div class="btn plain" ${at(192, 28)}>${icons.cross}</div>`,
  };
  let shown = "";
  function setBar(name, s) {
    const key = name + (s.press || "");
    if (key === shown) return;
    shown = key;
    bar.innerHTML = layouts[name](s);
    bar.classList.toggle("live", name === "live");
  }
  function setCircle(r) {
    const c = $("circle");
    if (!c) return;
    c.hidden = r <= 0;
    Object.assign(c.style, { left: REC[0] - r + "px", top: REC[1] - r + "px", width: 2 * r + "px", height: 2 * r + "px" });
  }
  const place = (el, x, y, w, h) => Object.assign(el.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });


  // What is being recorded: one app per loop, drawn on the window's canvas
  // in window points (552 × 299). The area covers x 86–486, y 19–249.
  const screen = $("screen"), g = screen.getContext("2d");
  const W = 552, H = 299;
  const mono = '11px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
  let dark = false, checked = -1;
  function rect(x, y, w, h, r, fill) {
    g.beginPath(); g.roundRect(x, y, w, h, r); g.fillStyle = fill; g.fill();
  }
  function line(x1, y1, x2, y2, stroke, width = 1) {
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.strokeStyle = stroke; g.lineWidth = width; g.stroke();
  }
  function text(str, x, y, fill, font = mono, align = "left") {
    g.font = font; g.fillStyle = fill; g.textAlign = align; g.fillText(str, x, y);
  }

  function car(t) {
    rect(0, 0, W, H, 0, "#2b2c30");
    rect(0, 0, 76, H, 0, "#232427");
    [50, 40, 46, 36, 42, 30].forEach((w, i) => rect(10, 14 + i * 16, w, 6, 3, i === 1 ? "#c98a3e" : "#45474d"));
    rect(76, 96, W - 76, 163, 0, "#323338");
    for (let x = -400; x <= 900; x += 60) line(x, 259, 314, 30, "rgba(255,255,255,0.05)");
    for (let k = 0; k < 9; k++) { const y = 96 + 160 / (1 + (8 - k) * 0.55); line(76, y, W, y, "rgba(255,255,255,0.05)"); }
    // Axes, top right.
    line(520, 40, 536, 40, "#d9534f", 2); line(520, 40, 520, 24, "#62b35b", 2); line(520, 40, 510, 50, "#4f86e0", 2);

    const p = t / T.end, cx = mix(40, 560, p), ground = 206;
    g.beginPath(); g.ellipse(cx, ground + 2, 62, 6, 0, 0, Math.PI * 2); g.fillStyle = "rgba(0,0,0,0.35)"; g.fill();
    rect(cx - 56, ground - 34, 112, 24, 8, "#5b8def");
    g.beginPath(); g.moveTo(cx - 32, ground - 33); g.lineTo(cx - 18, ground - 54); g.lineTo(cx + 20, ground - 54); g.lineTo(cx + 38, ground - 33);
    g.fillStyle = "#4a77cf"; g.fill();
    g.beginPath(); g.moveTo(cx - 24, ground - 35); g.lineTo(cx - 14, ground - 50); g.lineTo(cx + 2, ground - 50); g.lineTo(cx + 2, ground - 35);
    g.moveTo(cx + 7, ground - 35); g.lineTo(cx + 7, ground - 50); g.lineTo(cx + 17, ground - 50); g.lineTo(cx + 29, ground - 35);
    g.fillStyle = "#a9c6f6"; g.fill();
    rect(cx + 48, ground - 30, 7, 5, 2, "#f6e7a8");
    for (const wx of [cx - 32, cx + 32]) {
      g.beginPath(); g.arc(wx, ground - 10, 12, 0, Math.PI * 2); g.fillStyle = "#18191b"; g.fill();
      g.beginPath(); g.arc(wx, ground - 10, 5, 0, Math.PI * 2); g.fillStyle = "#8a8d94"; g.fill();
      const a = cx / 12;
      line(wx - Math.cos(a) * 9, ground - 10 - Math.sin(a) * 9, wx + Math.cos(a) * 9, ground - 10 + Math.sin(a) * 9, "#8a8d94", 2);
    }
    // Timeline with keyframes and the playhead.
    rect(0, 259, W, 40, 0, "#1f2023");
    for (let x = 86; x < W; x += 20) line(x, 263, x, x % 100 === 6 ? 273 : 268, "#45474d");
    for (const kx of [96, 256, 416]) { g.save(); g.translate(kx, 284); g.rotate(Math.PI / 4); rect(-4, -4, 8, 8, 1, "#e0b23a"); g.restore(); }
    const ph = mix(86, 536, p);
    line(ph, 259, ph, H, "#4f8ff7", 2);
    text(String(Math.round(p * 120)).padStart(3, "0"), ph + 5, 272, "#cfd3da");
  }

  function website(t) {
    const s = t / 1000;
    const canvas = dark ? "#1f1f23" : "#e6e6ea", panel = dark ? "#2a2a2f" : "#f5f5f7", rule = dark ? "#3a3a40" : "#d6d6db";
    const blue = "#3b82f6", buttons = ["#202024", "#2f6df0", "#e06a3b"];
    rect(0, 0, W, H, 0, canvas);
    rect(0, 0, 74, H, 0, panel); line(74, 0, 74, H, rule);
    rect(W - 66, 0, 66, H, 0, panel); line(W - 66, 0, W - 66, H, rule);
    ["Nav", "Hero", "Title", "Button", "Image", "Cards"].forEach((_, i) => rect(10, 14 + i * 16, [34, 30, 38, 42, 36, 32][i], 6, 3, i === 3 && s > 4 ? blue : rule));
    const colour = buttons[s < 5 ? 0 : s < 6.6 ? 1 : 2];
    rect(W - 56, 16, 46, 6, 3, rule); rect(W - 56, 30, 16, 16, 3, colour); rect(W - 36, 36, 26, 5, 2, rule);
    rect(W - 56, 58, 46, 6, 3, rule); rect(W - 56, 70, 34, 6, 3, rule);

    const ax = 92, ay = 12, aw = 380;
    rect(ax, ay, aw, 240, 2, "#ffffff");
    rect(ax + 16, ay + 14, 16, 16, 4, "#202024");
    [0, 1, 2].forEach((i) => rect(ax + aw - 120 + i * 36, ay + 19, 26, 6, 3, "#c9c9cf"));
    const grow = (from, dur) => ease(span(s, [from, from + dur]));
    rect(ax + 16, ay + 54, 190 * grow(0.6, 0.6), 16, 3, "#202024");
    rect(ax + 16, ay + 76, 140 * grow(1.2, 0.6), 16, 3, "#202024");
    [0, 1, 2].forEach((i) => rect(ax + 16, ay + 104 + i * 12, [170, 160, 120][i] * grow(2 + i * 0.25, 0.4), 6, 3, "#b9b9c0"));
    const bw = mix(84, 116, grow(6, 0.5)), by = ay + 152;
    g.globalAlpha = grow(3, 0.4);
    rect(ax + 16, by, bw, 28, 4, colour);
    rect(ax + 30, by + 11, bw - 28, 6, 3, "rgba(255,255,255,0.85)");
    g.globalAlpha = 1;
    const ix = ax + 232 + 30 * (1 - grow(3.6, 0.6));
    g.globalAlpha = grow(3.6, 0.6);
    rect(ix, ay + 50, 130, 130, 4, "#dfe4ec");
    g.beginPath(); g.moveTo(ix + 14, ay + 160); g.lineTo(ix + 54, ay + 104); g.lineTo(ix + 80, ay + 138); g.lineTo(ix + 96, ay + 120); g.lineTo(ix + 118, ay + 160);
    g.fillStyle = "#b5bfcd"; g.fill();
    g.beginPath(); g.arc(ix + 98, ay + 78, 10, 0, Math.PI * 2); g.fillStyle = "#f1c96b"; g.fill();
    g.globalAlpha = 1;
    [0, 1, 2].forEach((i) => { g.globalAlpha = grow(8 + i * 0.3, 0.4); rect(ax + 16 + i * 120, ay + 196, 108, 34, 4, "#f0f0f3"); });
    g.globalAlpha = 1;
    if (s > 4 && s < 9.5) {
      g.strokeStyle = blue; g.lineWidth = 1.5; g.strokeRect(ax + 14, by - 2, bw + 4, 32);
      for (const [hx, hy] of [[ax + 14, by - 2], [ax + 18 + bw, by - 2], [ax + 14, by + 30], [ax + 18 + bw, by + 30]]) {
        rect(hx - 3, hy - 3, 6, 6, 1, "#ffffff"); g.strokeRect(hx - 3, hy - 3, 6, 6);
      }
      text(`${Math.round(bw)} × 28`, ax + 16 + bw / 2, by + 46, blue, '10px ui-monospace, Menlo, Consolas, monospace', "center");
    }
  }

  const CODE = [
    [["fn ", "k"], ["greet", "f"], ["(name: &", "p"], ["str", "k"], [") -> ", "p"], ["String", "k"], [" {", "p"]],
    [["    format!", "f"], ["(", "p"], ['"Hello, {name}!"', "s"], [")", "p"]],
    [["}", "p"]],
    [],
    [["#[test]", "c"]],
    [["fn ", "k"], ["says_hello", "f"], ["() {", "p"]],
    [["    assert_eq!", "f"], ["(greet(", "p"], ['"Inb"', "s"], ["), ", "p"], ['"Hello, Inb!"', "s"], [");", "p"]],
    [["}", "p"]],
  ];
  const TERM = ["$ cargo test", "running 1 test", "test says_hello ... ok"];
  function code(t) {
    const hue = dark
      ? { bg: "#1d1d21", gut: "#5c5c66", p: "#d7d7de", k: "#c792ea", f: "#82aaff", s: "#c3e88d", c: "#7f8590", term: "#151518", ok: "#7fd27f" }
      : { bg: "#fbfbfc", gut: "#a5a5ad", p: "#2a2a30", k: "#8a3fc7", f: "#2f5fd0", s: "#3d7d26", c: "#8a8a93", term: "#f0f0f3", ok: "#2f8a2f" };
    rect(0, 0, W, H, 0, hue.bg);
    rect(0, 0, 150, 24, 0, dark ? "#26262b" : "#eeeef1");
    text("greet.rs", 14, 16, hue.p);
    let budget = Math.max(0, (t - 300) / 1000 * 45);
    CODE.forEach((tokens, row) => {
      const y = 50 + row * 17;
      text(String(row + 1).padStart(2, " "), 96, y, hue.gut);
      let x = 122;
      for (const [str, kind] of tokens) {
        const shown = str.slice(0, Math.max(0, Math.floor(budget)));
        budget -= str.length;
        if (!shown) break;
        text(shown, x, y, hue[kind]);
        x += g.measureText(shown).width;
      }
      budget -= 2;
      if (budget > -2 && budget <= 0 && Math.floor(t / 400) % 2 === 0) rect(x + 1, y - 9, 1.5, 12, 0, hue.p);
    });
    rect(0, 178, W, 121, 0, hue.term); line(0, 178, W, 178, dark ? "#2e2e34" : "#dedee3");
    text("Terminal", 96, 195, hue.gut);
    const typed = Math.floor(span(t, [4900, 5400]) * TERM[0].length);
    if (t > 4700) text(TERM[0].slice(0, typed), 96, 213, hue.p);
    TERM.slice(1).forEach((l, i) => { if (t > 5700 + i * 450) text(l, 96, 229 + i * 15, i === 1 ? hue.ok : hue.p); });
  }

  function game(t) {
    const sky = dark ? "#1d2833" : "#cfe2ee", hill = dark ? "#26394a" : "#b4cfe0", grass = dark ? "#3f7a4c" : "#5fa86b", dirt = dark ? "#5a4636" : "#9b7653";
    rect(0, 0, W, H, 0, sky);
    const run = t / 1000 * 80, px = 200;
    for (let i = -1; i < 5; i++) {
      const hx = i * 180 - (run * 0.3) % 180;
      g.beginPath(); g.ellipse(hx + 90, 236, 110, 70, 0, Math.PI, 0); g.fillStyle = hill; g.fill();
    }
    for (let i = -1; i < 4; i++) {
      const cx = i * 220 - (run * 0.15) % 220 + 60;
      rect(cx, 50 + (i % 2) * 22, 56, 14, 7, dark ? "#2c3c4b" : "#f5f9fc");
    }
    for (let x = -((run) % 24); x < W; x += 24) { rect(x, 236, 24, 8, 0, grass); rect(x, 244, 24, H - 244, 0, dirt); line(x, 244, x, H, "rgba(0,0,0,0.12)"); }
    for (let k = Math.floor(run / 180) - 1; k < Math.floor(run / 180) + 5; k++) {
      const ox = k * 180 - run + px;
      if (k > 0) rect(ox - 11, 214, 22, 22, 2, dark ? "#8b5e3c" : "#a4683f");
      const coinX = ox + 90;
      if (coinX > px + 4) { g.beginPath(); g.ellipse(coinX, 170, 5, 7, 0, 0, Math.PI * 2); g.fillStyle = "#f2c94c"; g.fill(); }
    }
    const u = ((run + 34) % 180) / 68, jump = u < 1 ? 4 * u * (1 - u) * 58 : 0;
    const py = 236 - 26 - jump;
    rect(px - 10, py, 20, 26, 3, "#e5602b");
    rect(px + 2, py + 6, 4, 5, 1, "#ffffff");
    rect(px - 10, py + 18, 20, 3, 0, "rgba(0,0,0,0.2)");
    text("SCORE " + String(Math.max(0, Math.floor((run - 90) / 180) + 1) * 10).padStart(4, "0"), 470, 40, dark ? "#e8eef3" : "#24323d", 'bold 12px ui-monospace, Menlo, Consolas, monospace', "right");
  }

  const SCENES = [
    ["Car animation", car],
    ["Landing page", website],
    ["greet.rs", code],
    ["Level 1", game],
  ];
  function drawScene(n, t) {
    if (checked !== n) {
      checked = n;
      $("title").textContent = SCENES[n][0];
    }
    dark = getComputedStyle(document.documentElement).colorScheme.includes("dark");
    g.setTransform(2, 0, 0, 2, 0, 0);
    SCENES[n][1](t);
  }

  function render(t, scene) {
    drawScene(scene, t);

    // The area: dragged bigger by its bottom-right corner.
    const d = ease(span(t, T.drag));
    const a = { x: START.x, y: START.y, w: Math.round(mix(START.w, END.w, d)), h: Math.round(mix(START.h, END.h, d)) };
    const right = a.x + a.w, bottom = a.y + a.h;

    // Red while live: fades in as the circle grows, out as it shrinks.
    const growStart = T.click + ARM;
    const red = t < T.stop ? span(t, [growStart, growStart + FADE]) : 1 - span(t, [T.stop, T.stop + FADE]);
    const out = Math.min(span(t, [0, 250]), 1 - span(t, T.fadeOut));

    place($("dim"), a.x, a.y, a.w, a.h);
    place($("band"), a.x - BAND, a.y - BAND, a.w + 2 * BAND - 4, a.h + 2 * BAND - 4);
    $("band").style.borderColor = rgb(red);
    const idleLook = t < growStart;
    [[a.x - BAND, a.y - BAND], [right + BAND - HANDLE, a.y - BAND], [a.x - BAND, bottom + BAND - HANDLE], [right + BAND - HANDLE, bottom + BAND - HANDLE]]
      .forEach(([hx, hy], i) => { const h = $("h" + i); place(h, hx, hy, HANDLE, HANDLE); h.hidden = !idleLook; });
    const barX = right + BAND - BAR_W, barY = bottom + BAND + GAP;
    bar.style.left = barX + "px";
    bar.style.top = barY + "px";
    stage.style.setProperty("--fade", out);
    for (const id of ["dim", "band", "bar", "h0", "h1", "h2", "h3"]) $(id).style.opacity = out;

    // The bar.
    const pressed = (when) => t >= when - 60 && t < when + 140;
    if (t < T.recording) {
      setBar("idle", { size: `${a.w} × ${a.h}`, press: pressed(T.click) ? "rec" : "" });
      $("size").textContent = `${a.w} × ${a.h}`;
      const wipe = span(t, [T.click, T.click + ARM]);
      const dot = $("dot");
      dot.style.webkitMaskImage = dot.style.maskImage = wipe > 0 && wipe < 1 ? `conic-gradient(transparent ${wipe}turn, #000 0)` : "";
      dot.style.visibility = wipe >= 1 ? "hidden" : "";
      setCircle(Math.max(0, ease(span(t, [growStart, growStart + GROW])) * 180));
    } else if (t < T.stop + 120) {
      setBar("live", { press: pressed(T.stop) ? "stop" : "" });
      setCircle(180);
      const s = Math.floor((t - T.recording) / 1000);
      $("time").textContent = `0:0${s}`;
    } else if (t < T.encoded) {
      setBar("encoding", {});
      setCircle(180 * (1 - ease(span(t, [T.stop + 120, T.stop + 120 + SHRINK]))));
      const p = span(t, [T.stop + 300, T.encoded - 100]);
      $("pct").textContent = Math.round(p * 100) + "%";
    } else {
      setBar("done", {});
    }

    // The pointer.
    const corner = [right + BAND - 1, bottom + BAND - 1];
    const rec = [barX + REC[0] + 2, barY + REC[1] + 2];
    const stop = [barX + 182, barY + 20];
    const legs = [
      [[600, 420], [START.x + START.w + 1, START.y + START.h + 1], T.toCorner],
      [null, rec, T.toRecord],
      [null, stop, T.toStop],
      [null, [560, 412], T.away],
    ];
    let pos = legs[0][0];
    for (const [i, [from, to, when]] of legs.entries()) {
      // The pointer holds the corner for the whole drag, then leaves from where it let go.
      if (i === 1 && t >= T.drag[0]) pos = corner;
      const p = ease(span(t, when));
      const a0 = from || pos;
      if (t >= when[0]) pos = [mix(a0[0], to[0], p), mix(a0[1], to[1], p)];
    }
    const down = (t >= T.drag[0] - 80 && t < T.drag[1] + 60) || pressed(T.click) || pressed(T.stop);
    cursor.style.transform = `translate(${pos[0] - 2}px, ${pos[1] - 2}px) scale(${down ? 0.88 : 1})`;
    cursor.style.opacity = out;
  }

  function fit() { stage.style.transform = `scale(${box.clientWidth / 640})`; }
  new ResizeObserver(fit).observe(box);
  fit();

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    render(5200, 0);
  } else {
    let t0 = performance.now();
    const loop = (now) => {
      const n = Math.floor((now - t0) / T.end);
      render((now - t0) % T.end, n % SCENES.length);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  // Downloads: link the latest release's files once there is one.
  fetch("https://api.github.com/repos/sandrogekeler/Inb/releases/latest")
    .then((r) => (r.ok ? r.json() : null))
    .then((rel) => {
      if (!rel) return;
      const find = (re) => (rel.assets || []).find((f) => re.test(f.name));
      const win = find(/win/i), mac = find(/mac|darwin/i);
      for (const [el, asset] of [[$("dl-win"), win], [$("dl-mac"), mac]]) {
        el.href = asset ? asset.browser_download_url : rel.html_url;
        el.removeAttribute("aria-disabled");
      }
    })
    .catch(() => {});
})();
</script>
</body>
