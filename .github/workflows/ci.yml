# Project-owned. Builds, lints and tests Inb on the two systems it runs on, and
# uploads each build so a pull request can be tried without a Rust toolchain.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runners ship rustup; Cargo.toml's rust-version is the floor.
      - run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --locked --release
          mkdir dist
          copy target\release\inb.exe dist\
        shell: cmd

      # One binary for Apple silicon and Intel Macs.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          mkdir dist
          lipo -create -output dist/inb \
            target/aarch64-apple-darwin/release/inb target/x86_64-apple-darwin/release/inb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inb-${{ runner.os }}
          path: dist/
          retention-days: 14
